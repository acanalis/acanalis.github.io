publishdir: docs
title: ΔY
baseurl: https://acanalis.github.io/

theme: PaperMod

enableEmoji: true
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
    extensions:
      linkify: false
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 1
    ordered: true
    endLevel: 2

params:
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true

defaultContentLanguage: en
languages:
  en:
    languageCode: "en-us"
    contentDir: content/en
    menu:
      main:
        - name: Posts
          url: post
          weight: 20
        - name: About
          url: about
          weight: 30
    params:
      homeInfoParams:
        Title: ΔY
        Content: Programming, learning and teaching.

  es:
    languageCode: "es-ar"
    contentDir: content/es
    menu:
      main:
        - name: Posts
          url: post
          weight: 20
        - name: Acerca de @acanalis
          url: about
          weight: 30
    params:
      homeInfoParams:
        Title: ΔY
        Content: Programación, aprendizaje y enseñanza.
